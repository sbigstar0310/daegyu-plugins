# Builds the lecture-capture helper binaries and attaches them to a GitHub release, so that
# users of the plugin do not need Xcode Command Line Tools. Trigger: push a tag
# `lecture-capture-v<version>` that matches lecture-capture/.claude-plugin/plugin.json.
name: lecture-capture release

on:
  push:
    tags: ["lecture-capture-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14   # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match plugin.json
        run: |
          v=$(jq -r .version lecture-capture/.claude-plugin/plugin.json)
          [ "$GITHUB_REF_NAME" = "lecture-capture-v$v" ] || {
            echo "tag $GITHUB_REF_NAME does not match plugin.json version $v"; exit 1; }

      - name: Build AudioTee at the pinned commit
        run: |
          ref=$(cat lecture-capture/scripts/AUDIOTEE_REF)
          mkdir audiotee && cd audiotee
          git init -q
          git fetch -q --depth 1 https://github.com/makeusabrew/audiotee "$ref"
          git checkout -q FETCH_HEAD
          swift build -c release --arch arm64
          cp .build/release/audiotee ../audiotee-arm64

      - name: Build winrec2
        run: |
          swiftc -O -target arm64-apple-macos14.2 \
            lecture-capture/scripts/winrec2/main.swift -o winrec2-arm64

      - name: Ad-hoc sign and sanity-check
        run: |
          for b in audiotee-arm64 winrec2-arm64; do
            codesign --force -s - "$b"
            codesign -v "$b"
            lipo -archs "$b" | grep -qx arm64
            vtool -show-build "$b" | grep -E 'minos|platform'
          done

      - name: Checksums and notices
        run: |
          shasum -a 256 audiotee-arm64 winrec2-arm64 > SHA256SUMS
          cat SHA256SUMS
          cp lecture-capture/NOTICE.md NOTICE.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Prebuilt arm64 helpers for lecture-capture (ad-hoc signed). AudioTee commit: $(cat lecture-capture/scripts/AUDIOTEE_REF). See NOTICE.md for third-party licenses." \
            audiotee-arm64 winrec2-arm64 SHA256SUMS NOTICE.md
